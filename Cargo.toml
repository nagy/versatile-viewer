[package]
name = "versatile-viewer"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A fast image (and later, video) viewer: nsxiv meets mpv. JPEG XL first-class."

[features]
# The on-disk thumbnail cache: the XDG lookup, the entry key and the JPEG XL
# encoder.
# Without it every launch decodes every file, and the grid still works.
default = ["cache", "svg", "mermaid", "elk"]
cache = ["dep:jixel", "dep:sha2", "dep:xdg"]
# SVG: sniffs the file head, parses with usvg and paints with tiny-skia.
# Without it src/svg_off.rs never claims a file, so no `.svg` file decodes.
svg = ["dep:fontdb", "dep:flate2", "dep:resvg", "dep:tiny-skia", "dep:usvg"]
# Mermaid: a `.mmd` file becomes an SVG string, which the SVG backend rasterizes.
# Without it src/mermaid_off.rs never claims a file.
# The feature needs the SVG backend, because that backend paints the diagram.
mermaid = ["svg", "dep:merman"]
# The ELK layout engine, which a `%%{init: {"layout": "elk"}}%%` directive asks for.
# Without it merman silently lays such a source out with dagre, its default.
#
# The provider arrives through the merman fork that `[patch.crates-io]` names at
# the end of this file: `merman-layout-elk` there drives `elk-layout`, whose
# layered plugin ships `EPL-2.0 OR GPL-3.0-or-later`.
# This crate takes the GPL arm, and GPL-3.0 combines with AGPL-3.0-or-later
# (GPL-3.0 section 13), so the feature ships in `default`.
elk = ["mermaid", "merman/layout-elk"]

[dependencies]
anyhow = "1.0.104"
# JPEG XL decode, pure Rust (no libjxl C dependency).
jxl-oxide = "0.12.6"
# Common-format decode. Keep in sync with grid.rs is_image_path(): every
# extension it accepts must have a feature here, except "pdf" (see below).
# webp = image-webp, pure Rust (lossy VP8 + lossless VP8L decode).
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tga",
  "tiff",
  "webp",
] }
raylib = "6.0.0"
# Work pool for parallel background decodes (grid prefetch); jxl-oxide also
# uses rayon internally for single-image decode (its default feature).
rayon = "1.12.0"
# PDF rasterization, pure Rust (no C dependency; vello_cpu rendering).
# Confined to pdf.rs: the rest of the viewer only sees the Surface trait
# (surface.rs), so a pdfium fallback swap touches one file. The default
# features embed the standard-14 fonts and the cmaps.
# 0.8 is required: render_into() takes an arbitrary kurbo::Affine, which is
# what makes a region render (visible crop) possible.
hayro = "0.8.0"
# Typst compile -> PDF export pipeline (pure Rust). Confined to typst.rs,
# which hands the exported PDF bytes to the hayro backend in pdf.rs, so one
# rasterizer draws every document. The exported pages are resolution
# independent, so a region render and a settled-zoom refine work for a Typst
# page exactly as for a PDF.
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
# Fonts embedded in the binary (its "fonts" feature), so the viewer needs no
# font directory and no environment variable.
typst-assets = { version = "0.15.1", features = ["fonts"] }
# SIMD image resize (the grid thumb, the texture cap, the preview and the
# blur background).
# Picks the best CPU extension at runtime.
# The `rayon` feature stays off: the project runs one resize per decode
# worker, and a nested parallel resize fights that pool for cores.
fast_image_resize = { version = "6.1.0", default-features = false, features = [
  "std",
  "bytemuck",
] }
# Casts between `u8` and the typed RGBA pixel of `fast_image_resize`.
bytemuck = "1.25.2"
# Natural-order file name sort (img2 before img10).
natord = "1.0.9"
# The few-byte placeholder of a grid thumbnail (ThumbHash, MIT, no
# dependencies). The cache header carries one payload per entry, so a warm
# launch paints the grid from headers before any JPEG XL decode.
thumbhash = "0.1.0"
# Memory-mapped file reads for the streaming JXL loader.
memmap2 = "0.9.12"
derive_more = { version = "2.1.1", default-features = false, features = [
  "display",
  "error",
  "from",
] }
# MCP (Model Context Protocol) server, spec revision 2026-07-28.
# The server runs on a background thread and owns stdin and stdout.
rmcp = { version = "3.8.0", default-features = false, features = [
  "server",
  "transport-io",
] }
# Async runtime for the rmcp server thread only.
# `rt` gives the current-thread runtime builder.
tokio = { version = "1.54.1", default-features = false, features = [
  "rt",
  "io-util",
] }
# The MCP tool schemas and the tool results.
serde_json = "1.0.154"
# The thumbnail cache directory.
# `get_cache_home` resolves $XDG_CACHE_HOME, and falls back to `~/.cache`.
xdg = { version = "3.0.0", optional = true }
# The thumbnail cache file name: SHA-256 of the canonical image path.
sha2 = { version = "0.11.1", optional = true }
# Lossy JPEG XL encode for a cache entry. Pure Rust, BSD-3-Clause OR
# Apache-2.0, so it carries no license drag.
# It is a second JXL codebase beside jxl-oxide, which only decodes.
# `extraslow` stays off: it pulls the perceptual metric crates, and a 512 px
# thumbnail never needs them. The SIMD backends stay on.
jixel = { version = "0.5.2", default-features = false, features = [
  "avx",
  "sse",
], optional = true }
# SVG rasterization, pure Rust (Apache-2.0 OR MIT), so no cairo and no C
# toolchain beside raylib's.
# `text` + `system-fonts` render <text> with the host fonts, which a logo or
# a diagram needs.
# `svgz` accepts a gzip codestream.
# The static subset only: no script, no animation, no `a` element.
# `raster-images` stays off, so an embedded JPEG/WebP/GIF in an <image>
# element does not render; an embedded PNG does, because the `png` crate is a
# core dependency of usvg.
resvg = { version = "0.49.0", default-features = false, features = [
  "system-fonts",
  "svgz",
  "text",
], optional = true }
# The rasterizer under resvg: the code paints a usvg tree into a Pixmap.
tiny-skia = { version = "0.12.0", default-features = false, features = [
  "std",
], optional = true }
# Gzip for a `.svgz` head. The code decompresses itself, so a gzip bomb hits
# a size cap instead of the allocator.
flate2 = { version = "1.1.10", default-features = false, features = [
  "rust_backend",
], optional = true }
# The host font database behind `system-fonts`. The code loads it once per
# process and hands the same Arc to every SVG parse.
fontdb = { version = "0.24.0", default-features = false, features = [
  "fs",
  "memmap",
], optional = true }
# The parser under resvg: XML, CSS and the tree the painter consumes.
# The same feature flags as resvg, so one version serves both.
usvg = { version = "0.49.0", default-features = false, features = [
  "system-fonts",
  "svgz",
  "text",
], optional = true }

# Mermaid to SVG, pure Rust (MIT OR Apache-2.0), so no Node.js and no
# Chromium. Confined to src/mermaid.rs: the rest of the viewer only sees the
# Surface trait.
# `svg` emits the diagram and `all-diagrams` compiles every family; `math`
# (KaTeX-style labels) stays off.
# ELK arrives through our `elk` feature only, never through merman's own
# default features, which would turn on the EPL-only `merman-elk-layered`.
# `native-fonts` measures a label with a real font file, which the backend
# feeds from the fontdb scan of svg.rs, so a fallback label box fits its text.
# `system-fonts` stays off: the viewer passes the face files itself, so no
# second system scan and no fontconfig dependency.
merman = { version = "0.9.3", default-features = false, features = [
  "all-diagrams",
  "native-fonts",
  "svg",
], optional = true }

# X11 WM_CLASS setup (XSetClassHint); Linux only, links the same libX11
# raylib's X11 backend already pulls in.
[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21.0"

[[bin]]
name = "vv"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.12.0"

[lints.clippy]
# Warning count stays at zero; pedantic is warn and burned down
# incrementally (plain cargo clippy shows the remaining findings).
all = "deny"
pedantic = "warn"

# The merman fork: the same facade, with an ELK provider over `elk-layout`
# (`EPL-2.0 OR GPL-3.0-or-later`) instead of the EPL-only `merman-elk-layered`.
# `Cargo.lock` pins the revision, so a build stays reproducible while `branch`
# keeps a bump one `cargo update -p merman` away.
[patch.crates-io]
merman = { git = "https://github.com/nagy/merman", branch = "elk-json-provider" }
