# The workspace of versatile-viewer.
#
# The root carries no package: the binary lives in `crates/vv-cli`, and every
# library layer below it is a member of its own, so an edit in one layer never
# recompiles the layers above it.
# `resolver = "3"` is mandatory here, because a virtual root has no package
# edition to infer the resolver from.
[workspace]
resolver = "3"
members = ["crates/*"]

# The metadata every member inherits.
# A member states `version.workspace = true` and friends, so one bump moves the
# whole tree.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor the tree builds on: edition 2024 asks for 1.85, and the first
# slice API (`as_chunks_mut` in `decode.rs` and `svg.rs`) landed in 1.88.
# A member declares no edition or version of its own.
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nagy/versatile-viewer"
# Nothing in this tree publishes: the workspace is one application, so every
# member inherits the refusal instead of repeating it.
publish = false

# The lint policy of the whole tree.
# A member opts in with `[lints] workspace = true`, so `cargo clippy` and the
# flake gate read one table.
# `all = "deny"` only applies under clippy.
[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

# The profile of the binary and of every member.
# The split into layers paid one price: a small function that crosses a crate
# boundary inlines only under link-time optimization (ADR 0004).
# `thin` collects the bitcode of the whole graph and inlines the hot calls
# across members, and it keeps the release build of seven crates short.
# `codegen-units = 2` (the cargo default is 16) gives the inliner more of the
# graph per unit than 16 does, and it still writes units in parallel.
[profile.release]
lto = "thin"
codegen-units = 2
