[package]
name = "versatile-viewer"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A fast image (and later, video) viewer: nsxiv meets mpv. JPEG XL first-class."

[dependencies]
anyhow = "1"
# JPEG XL decode, pure Rust (no libjxl C dependency).
jxl-oxide = "0.11"
# Common-format decode. Keep in sync with grid.rs is_image_path(): every
# extension it accepts must have a feature here.
# webp = image-webp, pure Rust (lossy VP8 + lossless VP8L decode).
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tga",
  "tiff",
  "webp",
] }
raylib = "6"
# Work pool for parallel background decodes (grid prefetch); jxl-oxide also
# uses rayon internally for single-image decode (its default feature).
rayon = "1"
# PDF rasterization, pure Rust (no C dependency; vello_cpu rendering).
# Confined to pdf.rs — the rest of the viewer only sees the Document trait
# (document.rs), so a pdfium fallback swap touches one file. Default
# features: embedded standard-14 fonts + cmaps (~240 KB).
hayro = "0.7"
# Typst compile -> render pipeline (pure Rust). Confined to typst.rs.
typst = "0.15"
typst-layout = "0.15"
typst-render = "0.15"
# Font discovery (fontdb system scan + explicit paths). No embedded fonts:
# fonts come from VV_TYPST_FONT_PATHS / TYPST_FONT_PATHS / system dirs, and
# the nix build bakes its font store path in at compile time.
typst-kit = { version = "0.15", default-features = false, features = [
  "scan-fonts",
] }

[[bin]]
name = "vv"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Warning count stays at zero; pedantic is warn and burned down
# incrementally (plain cargo clippy shows the remaining findings).
all = "deny"
pedantic = "warn"
