[package]
name = "vv-core"
description = "The geometry, the shared constants and the motion ramps of versatile-viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The layer carries no dependency of its own: it holds math, newtypes and
# policy, so every crate above it reads one vocabulary and nothing here can
# pull a decoder or a GPU handle into the graph.
[dev-dependencies]
# The proptests of `region`, `region_sel`, `rotate` and `tween`.
proptest = "1.12.0"

[lints]
workspace = true
