[package]
name = "vv-core"
description = "The geometry, the shared constants and the motion ramps of versatile-viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The layer pulls no decoder and no GPU handle, so every crate above it reads
# one vocabulary and nothing here can reach a picture or a device.
[dependencies]
# The `Display` and `Error` of `pixels::BufferError`, so a refused buffer names
# its cause and still lands where a `Box<dyn Error>` does. Only the two derives,
# because this layer writes no other error.
derive_more = { version = "2.1.1", default-features = false, features = [
  "display",
  "error",
] }
# The point, the size and the float vector math of the whole tree (`draw::Vec2`
# is a re-export).
# Pure Rust with no dependency of its own, and the scalar and SIMD paths pick
# one code path per build, so the geometry stays a plain value.
glam = "0.34.3"
# The rectangle of a window and of a plane (`dim::Rect` and `region::Crop`).
# The space tag of each one refuses a mix at compile time, so a window rect
# never lands where a rectangle of a surface belongs.
# Pure Rust, and `num-traits` is its one dependency.
euclid = "0.22.14"
# The path and the placement transform of a `scene` primitive.
# The path type belongs to neither a decoder nor the renderer, and the crate is
# already in the build through hayro, resvg and peniko, whose `peniko 0.6` wants
# this same version, so the tree carries one `kurbo`.
# `serde` is the wire form of the vocabulary a scene document states, and it
# covers the rect, the path, the stroke style and the placement transform a
# producer already writes.
kurbo = { version = "0.13.1", features = ["serde"] }
# The wire form of the scene vocabulary, so one process hands a list to another
# and neither side links the other's crate.
# `rc` is what lets the two fields held behind an `Arc`
# (`Paint::Linear::stops`, `GlyphRun::font`) cross the wire as they are read, so
# a label copies a handle here and no producer repeats the bytes.
serde = { version = "1.0.229", features = ["derive", "rc"] }

[dev-dependencies]
# The proptests of `region`, `region_sel`, `rotate` and `tween`.
proptest = "1.12.0"

[lints]
workspace = true
