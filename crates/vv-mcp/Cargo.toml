[package]
name = "vv-mcp"
description = "The Model Context Protocol server of versatile-viewer, on stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The answer vocabulary of a pushed picture (`Shown`, `Status`), which the view
# layer builds and this crate reports, so one shape serves both.
vv-core = { path = "../vv-core" }
# MCP (Model Context Protocol) server, spec revision 2026-07-28.
# The server runs on a background thread and owns stdin and stdout.
rmcp = { version = "3.11.0", default-features = false, features = [
  "server",
  "transport-io",
] }
# Async runtime for the rmcp server thread only.
# `rt` gives the current-thread runtime builder.
tokio = { version = "1.54.1", default-features = false, features = [
  "rt",
  "io-util",
] }
# The MCP tool schemas and the tool results.
serde_json = "1.0.154"
# The picture bytes of `vv_show_image_bytes` ride base64 in a JSON string, so
# one dependency decodes them and the server never reads a file for that tool.
base64 = "0.23.1"
derive_more = { version = "2.1.1", default-features = false, features = [
  "display",
  "error",
  "from",
] }
# The facade only: the server reports every tool it answers, and the binary owns
# the subscriber that decides where those lines go.
# A hand-written stderr line would carry no target, no fields and no timestamp.
tracing = "0.1.44"

[lints]
workspace = true
