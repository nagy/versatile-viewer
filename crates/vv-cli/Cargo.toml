[package]
name = "vv-cli"
description = "The vv binary: window, event loop and command line of versatile-viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary name stays `vv`, so the package name never shows in `ps`.
[[bin]]
name = "vv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# The diagnostics facade, which every layer below emits events through.
tracing = "0.1.44"
# The subscriber the application owns: the format, the level and the
# destination. `env-filter` reads `RUST_LOG`, so one variable filters the whole
# tree and `VV_DEBUG`/`VV_TIMING` stay as aliases of one level each.
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
# The command line.
# One derive struct owns the flags, the value parsers, `--help` and
# `--version`, so no argv loop and no usage string to keep in step.
clap = { version = "4.6.8", features = ["derive"] }
# The window, the event loop and the surface handle the binary owns, so the
# viewer library never reads a raw winit event.
winit = { version = "0.30.13", default-features = false, features = [
  "x11",
  "rwh_06",
] }
# The layers of the viewer: the geometry the event mapping names, the GPU stack
# it creates, the two views, and the MCP server it starts beside them.
vv-core = { path = "../vv-core" }
vv-gpu = { path = "../vv-gpu" }
vv-mcp = { path = "../vv-mcp" }
vv-view = { path = "../vv-view" }
# The display list a tool hands over arrives as the JSON fields it states, and
# this layer is the one that reads them into a scene document: the protocol
# layer names no geometry, so the value crosses the wall untouched.
serde_json = "1.0.154"

# The swapchain image view the frame hands to `Viewer::render`.
wgpu = { version = "30.0.2", default-features = false, features = [
  "vulkan",
  "wgsl",
] }

[dev-dependencies]
tempfile = "3.27.0"
# The embed example opens a frame window and a container child, so it speaks
# the X protocol directly.
x11rb = { version = "0.14.0", default-features = false }
# The headless paint tests (`tests/gpu_offscreen.rs`) build a device with no
# window and read the pixels back, so they name pollster themselves.
pollster = "1.0.2"
# Those paints cover the SVG, PDF, converted and book planes, so the test names
# the surface layer of its own.
vv-source = { path = "../vv-source" }
# The paint that stands a display list of its own builds the `kurbo` geometry a
# `scene::Primitive` carries, so the test names that geometry itself.
kurbo = "0.13.1"
# The budget of the display-list pass is calibrated against where the renderer
# itself starts painting nothing, so the test that pins it drives the renderer
# the pass drives: `vv-gpu` already carries this exact `vello`, and a dev
# dependency adds no copy to the tree the binary ships.
vello = { version = "0.12.0", default-features = false, features = ["wgpu"] }

[lints]
workspace = true
