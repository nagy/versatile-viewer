[package]
name = "vv-view"
description = "The grid, the image view and the reusable viewer of versatile-viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The window events of both views, the keyboard and the pointer.
# X11 only in this build: one display path, tested on the development host.
winit = { version = "0.30.13", default-features = false, features = [
  "x11",
  "rwh_06",
] }
# The X protocol, pure Rust (MIT OR Apache-2.0, no C and no bindgen).
# An embedded pane reads the size of the host window it fills: a host resizes
# the container it created, never the child, so the child hears nothing.
# `mpv --wid` reads the same geometry, and `winio` above opens no seam for it.
# The default feature set is empty, so no `libxcb` and no `libc` shim arrives.
x11rb = "0.14.0"
# The progressive decode of the streaming loader.
jxl-oxide = "0.12.6"
# Natural-order file name sort (img2 before img10).
natord = "1.0.9"
# The wgpu handles a host passes into `Viewer::new`, and the device and queue
# the viewer keeps. The pipeline itself lives in `vv-gpu`.
wgpu = { version = "30.0.2", default-features = false, features = [
  "vulkan",
  "wgsl",
] }
# The blur of the background gimmick (`imageops::blur`), which reads one RGBA
# buffer and writes another. No codec feature comes with it: the decode stays
# in `vv-source`.
image = { version = "0.25.10", default-features = false }
# The work pool of the grid prefetch and of the region prefetch of a spread.
rayon = "1.12.0"
# The error type of the viewer entry points.
anyhow = "1.0.104"
derive_more = { version = "2.1.1", default-features = false, features = [
  "display",
  "error",
  "from",
] }
# The layers below: the geometry and the shared constants, the pixel buffer,
# the pipeline an upload goes through, the entry a thumb caches in, and every
# showable source.
vv-cache = { path = "../vv-cache" }
vv-core = { path = "../vv-core" }
vv-pixels = { path = "../vv-pixels" }
vv-gpu = { path = "../vv-gpu" }
vv-source = { path = "../vv-source" }

[dev-dependencies]
# A test writes a picture of its own (PNG, WebP, BMP, GIF, TGA, TIFF), so the
# encoder half of `image` comes with the test build alone.
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tga",
  "tiff",
  "webp",
] }
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true
