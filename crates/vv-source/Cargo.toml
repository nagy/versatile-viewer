[package]
name = "vv-source"
description = "The showable sources of versatile-viewer: raster, SVG, PDF, book and converted files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# JPEG XL decode, pure Rust (no libjxl C dependency).
jxl-oxide = "0.12.6"
# Common-format decode. Keep in sync with grid.rs is_image_path(): every
# extension it accepts must have a feature here, except "pdf", which the hayro
# backend in pdf.rs routes on its magic.
# webp = image-webp, pure Rust (lossy VP8 + lossless VP8L decode).
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tga",
  "tiff",
  "webp",
] }
# PDF rasterization, pure Rust (no C dependency; vello_cpu rendering).
# Confined to pdf.rs: the rest of the crate only sees the Surface trait
# (surface.rs), so a pdfium fallback swap touches one file. The default
# features embed the standard-14 fonts and the cmaps.
# 0.8 or newer is required: render_into() takes an arbitrary kurbo::Affine,
# which is what makes a region render (visible crop) possible.
hayro = "0.9.0"
# Memory-mapped file reads for the streaming JXL loader.
memmap2 = "0.9.12"
# The work pool of the book and PDF planes, and of the streaming JXL decode.
rayon = "1.12.0"
# SVG rasterization, pure Rust (Apache-2.0 OR MIT), so no cairo and no C
# toolchain beside it.
# `text` + `system-fonts` render <text> with the host fonts, which a logo or
# a diagram needs.
# `svgz` accepts a gzip codestream.
# The static subset only: no script, no animation, no `a` element.
# `raster-images` stays off, so the raster path of an embedded JPEG/WebP/GIF in
# an <image> element draws nothing; an embedded PNG does, because the `png` crate
# is a core dependency of usvg.
# The display list is not bound by that: `vector_scene` decodes a picture leaf
# through the `image` features above, so a listed document draws all four. A
# document that answers no list keeps the raster path and keeps this gap.
resvg = { version = "0.50.0", default-features = false, features = [
  "system-fonts",
  "svgz",
  "text",
] }
# The rasterizer under resvg: the code paints a usvg tree into a Pixmap.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
# Gzip for a `.svgz` head. The code decompresses itself, so a gzip bomb hits
# a size cap instead of the allocator.
flate2 = { version = "1.1.11", default-features = false, features = [
  "rust_backend",
] }
# The host font database behind `system-fonts`. The code loads it once per
# process and hands the same Arc to every SVG parse.
fontdb = { version = "0.24.0", default-features = false, features = [
  "fs",
  "memmap",
] }
# The parser under resvg: XML, CSS and the tree the painter consumes.
# The same feature flags as resvg, so one version serves both.
usvg = { version = "0.50.0", default-features = false, features = [
  "system-fonts",
  "svgz",
  "text",
] }
# The rule table of the converters (`src/convert.rs`): TOML, pure Rust
# (MIT OR Apache-2.0).
# `parse` and `serde` alone, so the writer half of the crate stays out.
toml = { version = "1.2.1", default-features = false, features = [
  "parse",
  "serde",
] }
# The `Deserialize` of that config file. `deny_unknown_fields` on three small
# structs replaces a hand walk over `toml::Value`, so an unknown key stays an
# error and a rule inherits `[defaults]` through an `Option` per field.
# No feature beyond the derive macro: the file has no allocator of its own.
serde = { version = "1.0.229", features = ["derive"] }
# The format of a scene document (`src/scene_file.rs`), which a producer in
# another process writes: JSON because a person or an agent reads the file as
# often as this viewer does, and because the vocabulary's own serde is the whole
# schema. The same version `vv-mcp` and `vv-cli` link.
serde_json = "1.0.154"
# The kill of a timed-out converter, which names its whole process group by the
# negative pid. Only the one syscall wrapper.
libc = "0.2.191"
# The cache key of one conversion: SHA-256 of the argv and the source bytes.
# The key format belongs to the converter seam, so this crate hashes it and
# hands `vv-cache` an opaque string.
sha2 = "0.11.1"
# The glyph ids and advance widths of a treemap label, which this tree lays out
# itself instead of handing a document to a parser. The 0.44 line is the one
# `usvg` and `hayro-font` already pull, so the lock carries no new copy; vello
# parses the same face with its own line and the ids are just numbers.
skrifa = "0.44.0"
# The geometry a `scene` primitive names: the path of a vector leaf, the affine
# that places it, and the stroke style of an outline. The same version `vv-core`
# declares, and the one peniko wants, so the tree carries one `kurbo`.
kurbo = "0.13.1"
# The diagnostics facade. This layer emits events and names no output layer:
# the binary owns the subscriber and the `RUST_LOG` filter.
tracing = "0.1.44"
derive_more = { version = "2.1.1", default-features = false, features = [
  "display",
  "error",
  "from",
] }
# The layers below: the crop and the newtypes, the pixel buffer every backend
# answers with, and the entry a converted source caches.
vv-cache = { path = "../vv-cache" }
vv-core = { path = "../vv-core" }
vv-pixels = { path = "../vv-pixels" }

[dev-dependencies]
tempfile = "3.27.0"
# The squarified layout of `treemap.rs`: containment, no overlap and the area a
# weight takes are properties of every weight list, not of one example.
proptest = "1.12.0"

[lints]
workspace = true
